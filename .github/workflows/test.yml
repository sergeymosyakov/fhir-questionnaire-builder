name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=verbose --reporter=github-actions --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list*
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @perf --max-failures=1
      # Upload the HTML report even when tests fail so it can be deployed / inspected.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      # Upload test-results (screenshots + videos) on failure.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  # Performance regression suite (@perf) — runs separately so noisy-runner
  # variance never blocks the deploy. Ceilings are generous; catches gross
  # regressions only.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list*
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @perf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: perf-results
          path: test-results/
          retention-days: 30

  # Deploy app + test report to GitHub Pages.
  # Requires: Settings → Pages → Source = "GitHub Actions".
  deploy:
    needs: [lint, test, e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Download the HTML reports generated by test and e2e jobs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-report
          path: playwright-report/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage/
      # Assemble _site/: app files at root, reports in subfolders.
      - name: Prepare site
        run: |
          mkdir -p _site/playwright-report _site/coverage
          rsync -a \
            --exclude=_site \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=test-results \
            --exclude=playwright-report \
            --exclude=coverage \
            --exclude=/tests \
            --exclude=/scripts \
            --exclude=/nuget \
            --exclude=/.claude \
            --exclude=/wrangler.toml \
            --exclude=/start.ps1 \
            --exclude=/CLAUDE.md \
            --exclude='/*.config.js' \
            . _site/
          cp -r playwright-report/. _site/playwright-report/
          cp -r coverage/. _site/coverage/
      # Test reports are for developers, not search results: mark every report page noindex and fail the deploy if one is missed.
      - name: Mark reports noindex
        run: |
          find _site/coverage _site/playwright-report -name '*.html' -exec sed -i 's#<head>#<head><meta name="robots" content="noindex, nofollow">#I' {} +
          missing=$(grep -rL 'name="robots" content="noindex' --include='*.html' _site/coverage _site/playwright-report || true)
          if [ -n "$missing" ]; then echo "Report pages without noindex:"; echo "$missing"; exit 1; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
