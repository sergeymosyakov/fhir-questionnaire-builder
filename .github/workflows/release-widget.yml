# Build the widget bundle, run the full test suite, and publish a GitHub Release.
#
# Versioning: version.json holds { major, minor } (hand-edited). The patch number
# auto-increments from 0 per major.minor — it is the count of existing
# `widget-vMAJOR.MINOR.*` tags. So the first release of a minor is x.y.0, the
# next x.y.1, etc.; bump minor/major in version.json to reset the patch to 0.
#
# nuget_only: recovery path when NuGet publish alone failed for the current
# release (npm + GitHub Release already succeeded). Skips lint/test/e2e/tag/
# release/npm and republishes the existing latest widget-v* version to NuGet.
#
# Jobs: `verify` (read-only: install, lint, tests, build, version) → `publish` (write + OIDC:
# GitHub Release, npm, NuGet) publishes exactly the files `verify` built, so dependency
# install scripts never run with publishing rights.
#
# dry_run: runs verify, NuGet pack and `npm pack --dry-run`; skips release creation and the npm/NuGet login and push.
#
# Trigger: manual only (Actions → "Release widget" → Run workflow).
name: Release widget

on:
  workflow_dispatch:
    inputs:
      nuget_only:
        description: "Republish only NuGet for the current version (skip tag/release/npm)"
        type: boolean
        default: false
      dry_run:
        description: "Rehearse: run everything except publishing (does not exercise npm/NuGet OIDC login)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-widget
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      semver: ${{ steps.ver.outputs.semver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all history + tags needed to compute the patch number
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
        if: ${{ !inputs.nuget_only }}
      - run: npm test
        if: ${{ !inputs.nuget_only }}
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list*
        if: ${{ !inputs.nuget_only }}
      - run: npx playwright install --with-deps chromium
        if: ${{ !inputs.nuget_only }}
      - run: npx playwright test --grep-invert @perf --max-failures=1
        if: ${{ !inputs.nuget_only }}

      - run: npm run build:widget

      - name: Compute version
        id: ver
        env:
          NUGET_ONLY: ${{ inputs.nuget_only }}
        run: |
          MAJOR=$(node -p "require('./version.json').major")
          MINOR=$(node -p "require('./version.json').minor")
          git fetch --tags --force
          if [ "$NUGET_ONLY" = "true" ]; then
            TAG=$(git tag -l "widget-v${MAJOR}.${MINOR}.*" | sort -V | tail -1)
            if [ -z "$TAG" ]; then echo "No existing widget-v${MAJOR}.${MINOR}.* tag found" >&2; exit 1; fi
          else
            PATCH=$(git tag -l "widget-v${MAJOR}.${MINOR}.*" | wc -l | tr -d ' ')
            TAG="widget-v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "semver=${TAG#widget-v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Checksums
        if: ${{ !inputs.nuget_only }}
        run: (cd dist && sha256sum questionnaire-widget.js questionnaire-widget.global.js questionnaire-widget.css > SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: widget-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write   # required for npm / NuGet Trusted Publishing (OIDC), no tokens stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags needed for the release notes
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: widget-dist
          path: dist/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Summary
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "Tag: $TAG (dry_run=$DRY_RUN)"
          ls -l dist

      # Packed before anything irreversible so a packaging error blocks the run early.
      - name: Pack NuGet package
        env:
          PKG_VERSION: ${{ needs.verify.outputs.semver }}
        run: |
          mkdir -p nuget/wwwroot
          cp dist/questionnaire-widget.js dist/questionnaire-widget.global.js dist/questionnaire-widget.css nuget/wwwroot/
          cp LICENSE nuget/LICENSE
          cp WIDGET.md nuget/README.md
          dotnet pack nuget/FhirQuestionnaireWidget.csproj -c Release -p:PackageVersion="$PKG_VERSION" -o nuget-out

      - name: Create release
        if: ${{ !inputs.nuget_only && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          SEMVER: ${{ needs.verify.outputs.semver }}
          REPO: ${{ github.repository }}
        run: |
          # Previous widget tag = newest existing one (the new tag isn't created yet).
          PREV=$(git tag -l 'widget-v*' | sort -V | tail -1)
          # Auto-generate the "What's Changed" changelog from the commits since PREV.
          CHANGELOG=$(gh api "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" ${PREV:+-f previous_tag_name="$PREV"} --jq '.body' || true)
          { cat .github/release-notes-widget.md; echo; echo "$CHANGELOG"; } > /tmp/notes.md
          gh release create "$TAG" \
            dist/questionnaire-widget.js \
            dist/questionnaire-widget.global.js \
            dist/questionnaire-widget.css \
            dist/SHA256SUMS.txt \
            --latest \
            --target "$GITHUB_SHA" \
            --title "QuestionnaireRenderer widget $SEMVER" \
            --notes-file /tmp/notes.md

      # Publishes via npm Trusted Publishing (OIDC) — no token/secret involved.
      # Requires a trusted publisher configured on npmjs.com for this repo +
      # workflow file. Non-blocking: the GitHub Release above already succeeded.
      - name: Publish to npm (npmjs.com, Trusted Publishing)
        if: ${{ !inputs.nuget_only }}
        continue-on-error: ${{ !inputs.dry_run }}   # a rehearsal must fail loudly
        env:
          PKG_VERSION: ${{ needs.verify.outputs.semver }}
          PKG_OWNER: ${{ github.repository_owner }}
          PKG_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm install -g npm@11.21.0   # >= 11.5.1 needed for Trusted Publishing; pinned for reproducibility
          node -e '
            const fs = require("fs");
            const pkg = {
              name: "@" + process.env.PKG_OWNER + "/questionnaire-widget",
              version: process.env.PKG_VERSION,
              description: "Embeddable FHIR R4 QuestionnaireRenderer widget",
              type: "module",
              main: "questionnaire-widget.js",
              module: "questionnaire-widget.js",
              exports: { ".": "./questionnaire-widget.js", "./global": "./questionnaire-widget.global.js", "./css": "./questionnaire-widget.css" },
              files: ["questionnaire-widget.js", "questionnaire-widget.global.js", "questionnaire-widget.css", "LICENSE", "README.md"],
              repository: "git+https://github.com/" + process.env.PKG_REPO + ".git",
              license: "SEE LICENSE IN LICENSE"
            };
            fs.writeFileSync("dist/package.json", JSON.stringify(pkg, null, 2));
          '
          cp LICENSE dist/LICENSE
          cp WIDGET.md dist/README.md
          cd dist
          if [ "$DRY_RUN" = "true" ]; then npm pack --dry-run; else npm publish --access public --provenance; fi

      # Publishes via NuGet Trusted Publishing (OIDC) — no token/secret involved.
      # Requires the "release-widget-github-actions" trusted publisher policy
      # configured on nuget.org for this repo + workflow file. Non-blocking:
      # the GitHub Release and npm publish above already succeeded.
      - name: NuGet Trusted Publishing login
        id: nuget-login
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: sergeymosyakov

      - name: Publish to NuGet
        if: ${{ !inputs.dry_run && steps.nuget-login.outcome == 'success' }}
        continue-on-error: true
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nuget-out/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
