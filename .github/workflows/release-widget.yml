# Build the widget bundle, run the full test suite, and publish a GitHub Release.
#
# Versioning: version.json holds { major, minor } (hand-edited). The patch number
# auto-increments from 0 per major.minor — it is the count of existing
# `widget-vMAJOR.MINOR.*` tags. So the first release of a minor is x.y.0, the
# next x.y.1, etc.; bump minor/major in version.json to reset the patch to 0.
#
# Trigger: manual (Actions → "Release widget" → Run workflow). The release is
# only cut when lint + unit + e2e all pass.
name: Release widget

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests"]      # auto-release after the Tests workflow succeeds
    types: [completed]
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: release-widget
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only release on a manual run or a *successful* Tests run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # all history + tags needed to compute the patch number

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep-invert @perf --max-failures=1

      - run: npm run build:widget

      - name: Compute version
        id: ver
        run: |
          MAJOR=$(node -p "require('./version.json').major")
          MINOR=$(node -p "require('./version.json').minor")
          git fetch --tags --force
          PATCH=$(git tag -l "widget-v${MAJOR}.${MINOR}.*" | wc -l | tr -d ' ')
          TAG="widget-v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "semver=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Checksums
        run: (cd dist && sha256sum questionnaire-widget.js questionnaire-widget.global.js questionnaire-widget.css > SHA256SUMS.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Previous widget tag = newest existing one (the new tag isn't created yet).
          PREV=$(git tag -l 'widget-v*' | sort -V | tail -1)
          # Auto-generate the "What's Changed" changelog from the commits since PREV.
          CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" ${PREV:+-f previous_tag_name="$PREV"} --jq '.body' || true)
          { cat .github/release-notes-widget.md; echo; echo "$CHANGELOG"; } > /tmp/notes.md
          gh release create "$TAG" \
            dist/questionnaire-widget.js \
            dist/questionnaire-widget.global.js \
            dist/questionnaire-widget.css \
            dist/SHA256SUMS.txt \
            --latest \
            --title "QuestionnaireRenderer widget ${{ steps.ver.outputs.semver }}" \
            --notes-file /tmp/notes.md

      # Optional: publish to npmjs.com for a password-less `npm install`.
      # Runs only when an NPM_TOKEN repo secret is set; otherwise skips (the
      # Release assets + jsDelivr CDN remain the primary, no-auth channels).
      - name: Publish to npm (npmjs.com, optional)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_VERSION: ${{ steps.ver.outputs.semver }}
          PKG_OWNER: ${{ github.repository_owner }}
          PKG_REPO: ${{ github.repository }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN not set — skipping npm publish (Release + CDN remain the primary channels)."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const pkg = {
              name: "@" + process.env.PKG_OWNER + "/questionnaire-widget",
              version: process.env.PKG_VERSION,
              description: "Embeddable FHIR R4 QuestionnaireRenderer widget",
              type: "module",
              main: "questionnaire-widget.js",
              module: "questionnaire-widget.js",
              exports: { ".": "./questionnaire-widget.js", "./global": "./questionnaire-widget.global.js", "./css": "./questionnaire-widget.css" },
              files: ["questionnaire-widget.js", "questionnaire-widget.global.js", "questionnaire-widget.css"],
              repository: "git+https://github.com/" + process.env.PKG_REPO + ".git",
              license: "SEE LICENSE IN LICENSE"
            };
            fs.writeFileSync("dist/package.json", JSON.stringify(pkg, null, 2));
          '
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > dist/.npmrc
          cd dist && npm publish --access public
