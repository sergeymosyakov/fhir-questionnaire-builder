<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed the FHIR Questionnaire Renderer — live demo</title>
  <meta name="description" content="Live demo of the embeddable FHIR R4 QuestionnaireRenderer widget — three isolated in-page forms with search, validation, explain and a custom Export FHIR R4 button.">
  <link rel="canonical" href="https://fhirbuilder.com/widget-demo.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Embed the FHIR Questionnaire Renderer — live demo">
  <meta property="og:description" content="Embeddable FHIR R4 QuestionnaireRenderer widget — in-page, multi-instance, isolated forms driven entirely by config and a small API.">
  <meta property="og:url"         content="https://fhirbuilder.com/widget-demo.html">
  <meta property="og:image"       content="https://fhirbuilder.com/docs/social-preview.png">

  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Embed the FHIR Questionnaire Renderer — live demo">
  <meta name="twitter:description" content="Embeddable FHIR R4 QuestionnaireRenderer widget — in-page, multi-instance, isolated forms.">
  <meta name="twitter:image"       content="https://fhirbuilder.com/docs/social-preview.png">

  <link rel="stylesheet" href="css/widget.css">
  <script src="lib/marked.min.js"></script>
  <script src="lib/dompurify.min.js"></script>
  <script src="lib/fhirpath.min.js"></script>
  <script src="lib/fhirpath.r4.min.js"></script>
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #222; background: #f6f7f9; display: flex; flex-direction: column; overflow: hidden; }
    header { flex: none; padding: 16px 24px; background: #fff; border-bottom: 1px solid #e3e6ea; }
    header h1 { font-size: 18px; margin: 0; }
    header p  { margin: 4px 0 0; color: #666; font-size: 13px; }
    .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px 24px; align-items: stretch; }
    .col { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .col > h2 { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; margin: 0; padding: 8px 12px; background: #f0f2f5; border-bottom: 1px solid #e3e6ea; text-transform: uppercase; letter-spacing: .04em; color: #444; }
    .col > .mount { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }
    .export-btn { flex: none; text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; padding: 4px 10px; border: 1px solid #1565c0; border-radius: 5px; background: #1565c0; color: #fff; cursor: pointer; }
    .export-btn:hover { background: #0d47a1; }
    @media (max-width: 1100px) { body { overflow: auto; } .grid { grid-template-columns: 1fr; } .col { max-height: 80vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Embedded FHIR Questionnaire Renderer</h1>
    <p>One page, three independent <code>QuestionnaireRenderer</code> widgets — each with its own isolated session.</p>
  </header>

  <div class="grid">
    <section class="col">
      <h2>previewMode: preview (design) <button class="export-btn" data-export="preview">Export FHIR R4</button></h2>
      <div class="mount" data-mode="preview"></div>
    </section>
    <section class="col">
      <h2>previewMode: patient (fill) <button class="export-btn" data-export="patient">Export FHIR R4</button></h2>
      <div class="mount" data-testid="widget-mount" data-mode="patient"></div>
    </section>
    <section class="col">
      <h2>previewMode: json <button class="export-btn" data-export="json">Export FHIR R4</button></h2>
      <div class="mount" data-mode="json"></div>
    </section>
  </div>

  <script type="module">
    import { QuestionnaireRenderer } from './js/renderer/index.js';

    const questionnaire = await (await fetch('sampledata/annual-health-check.fhir.json')).json();
    const mount = mode => document.querySelector(`[data-mode="${mode}"]`);

    // Same questionnaire, three independent widgets — one per previewMode.
    // Each opts into the search box + live validation badge via config.
    const preview = new QuestionnaireRenderer(mount('preview'), {
      questionnaire,
      config: { previewMode: 'preview', search: true, validation: true, explain: true, tooltips: true, viewPrefs: { showLinkId: true, showPrefix: true, showBadges: true, showHiddenItems: true } },
    });
    const patient = new QuestionnaireRenderer(mount('patient'), {
      questionnaire,
      config: { previewMode: 'patient', search: true, validation: true, explain: true, tooltips: true },
    });
    const json = new QuestionnaireRenderer(mount('json'), {
      questionnaire,
      config: { previewMode: 'json', search: true, validation: true, tooltips: true },
    });

    // Expose for the demo / e2e.
    window.__widgets = { preview, patient, json };
    window.__widget  = patient;   // primary instance used by the render/getResponse e2e
    patient.on('response-changed', qr => { window.__lastQR = qr; });
    patient.on('ready', () => { window.__widgetReady = true; });

    // Host-page "Export FHIR R4" buttons — NOT part of the widget. Each one asks
    // its widget for the current answers via the public getResponse() API and
    // downloads them as a FHIR R4 QuestionnaireResponse JSON file.
    const widgets = { preview, patient, json };
    for (const btn of document.querySelectorAll('.export-btn')) {
      btn.addEventListener('click', () => {
        const qr = widgets[btn.dataset.export].getResponse();
        const blob = new Blob([JSON.stringify(qr, null, 2)], { type: 'application/fhir+json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `questionnaire-response.${btn.dataset.export}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }
  </script>
</body>
</html>
